<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — PneumoVision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  <style>
    .auth-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px;
      backdrop-filter: blur(12px);
    }
    .auth-brand { text-align: center; margin-bottom: 6px; font-size: 1.6rem; font-weight: 800; }
    .auth-brand strong { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .auth-sub { text-align: center; color: var(--txt2); margin-bottom: 28px; font-size: 0.9rem; }
    .auth-field { margin-bottom: 16px; }
    .auth-field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .auth-field input {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--glass-b); background: rgba(255,255,255,0.03);
      color: var(--txt); font-size: 0.95rem; outline: none;
    }
    .auth-field input:focus { border-color: var(--blue); }
    .auth-submit {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      background: var(--grad); color: #fff; font-weight: 700; font-size: 0.95rem;
      cursor: pointer; margin-top: 6px;
    }
    .auth-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-error {
      background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
      color: #f87171; padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 16px;
      display: none;
    }
    .auth-switch { text-align: center; margin-top: 22px; font-size: 0.88rem; color: var(--txt2); }
    .auth-switch a { color: var(--blue); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-page-wrap">
    <div class="auth-card">
      <div class="auth-brand">🫁 Pneumo<strong>Vision</strong></div>
      <p class="auth-sub">Welcome back — please sign in to continue.</p>

      <div class="auth-error" id="authError"></div>

      <form id="loginForm">
        <div class="auth-field">
          <label>Username or Email</label>
          <input type="text" id="identifier" required autocomplete="username">
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="auth-submit" id="submitBtn">Sign In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="{{ url_for('signup_page') }}">Create one</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('authError');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identifier: document.getElementById('identifier').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();

        if (!res.ok) {
          errBox.textContent = data.error || 'Login failed.';
          errBox.style.display = 'block';
          return;
        }

        window.location.href = '/';
      } catch (err) {
        errBox.textContent = 'Network error. Please try again.';
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
